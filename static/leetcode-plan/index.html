// W17–W19（12/7–12/27）：面试季，只做错题本重做 + 面试当天热身 1 题，无新题安排。

var KEY = "lc16w_plan_v1";
var state = null;
function load(){
  try{ state = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ state = {}; }
  state.done = state.done || {};
  state.star = state.star || {};
  state.checkins = state.checkins || [];
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function slug(s){ return s; }

// ---------- 渲染 ----------
function weekRange(w){ // 2026 年 W1=8/17
  var base = new Date(2026, 7, 17); // 2026-08-17
  base.setDate(base.getDate() + (w-1)*7);
  var end = new Date(base); end.setDate(end.getDate()+6);
  return [base, end];
}
function isCurrentWeek(w){
  var r = weekRange(w), n = new Date();
  return n >= r[0] && n <= r[1];
}
function totalCounts(){
  var core=0, extra=0;
  WEEKS.forEach(function(wk){ core += wk.core.length; extra += wk.extra.length; });
  return [core, extra];
}
function renderToc(){
  var el = document.getElementById("toc"); el.innerHTML = "";
  WEEKS.forEach(function(wk){
    var a = document.createElement("a");
    a.href = "#w" + wk.w; a.textContent = "W" + wk.w;
    el.appendChild(a);
  });
}
function itemHtml(n, s, t, d, isExtra){
  var key = s + (isExtra ? "|x" : "");
  var done = !!state.done[key];
  var starred = !!state.star[key];
  return '<label class="item">' +
    '<input type="checkbox" data-key="' + key + '"' + (done ? " checked" : "") + '>' +
    '<a href="https://leetcode.cn/problems/' + s + '/" target="_blank" rel="noopener"' + (done ? ' class="done"' : "") + '>№' + n + ' ' + t + '</a>' +
    '<span class="diff ' + d + '">' + d + '</span>' +
    '<button type="button" class="star' + (starred ? " on" : "") + '" data-star="' + key + '">' + (starred ? "★" : "☆") + '</button>' +
    '</label>';
}
function renderWeeks(){
  var el = document.getElementById("weeks"); el.innerHTML = "";
  WEEKS.forEach(function(wk){
    var now = isCurrentWeek(wk.w);
    var total = wk.core.length + wk.extra.length;
    var done = 0;
    wk.core.concat(wk.extra).forEach(function(p){
      if (state.done[p[1]]) done++;
      if (state.done[p[1] + "|x"]) done++;
    });
    // 双 key 去重统计（核心题也可能以 |x 形式存在历史数据，按任一命中计）
    var keysDone = {};
    wk.core.concat(wk.extra).forEach(function(p){ keysDone[p[1]] = keysDone[p[1]] || state.done[p[1]] || state.done[p[1]+"|x"]; });
    done = Object.values(keysDone).filter(Boolean).length;
    var pct = Math.round(done/total*100);
    var badge = now ? '<span class="badge now">本周</span>' : (done===total ? '<span class="badge done">✓ 完成</span>' : '<span class="badge part">' + pct + '%</span>');
    var html = '<section class="week' + (now ? " now" : "") + '" id="w' + wk.w + '">' +
      '<div class="wh"><span class="wt">W' + wk.w + ' · ' + wk.t + '</span><span class="wd">' + wk.d + '</span>' + badge +
      '<div class="goal">🎯 ' + wk.goal + (wk.note ? '　·　📌 ' + wk.note : '') + '</div></div>' +
      '<div class="wp"><div class="bar"><i style="width:' + pct + '%"></i></div><span class="pt">' + done + '/' + total + '</span></div>' +
      '<div class="wb"><h4>核心题（必刷）</h4>' + wk.core.map(function(p){ return itemHtml(p[0], p[1], p[2], p[3], false); }).join("") +
      '<h4 class="ex">拓展巩固（做完核心再刷）</h4>' + wk.extra.map(function(p){ return itemHtml(p[0], p[1], p[2], p[3], true); }).join("") +
      '</div></section>';
    el.insertAdjacentHTML("beforeend", html);
  });
}
function renderStats(){
  var tc = totalCounts();
  var total = tc[0] + tc[1];
  var done = 0;
  WEEKS.forEach(function(wk){
    wk.core.concat(wk.extra).forEach(function(p){
      if (state.done[p[1]] || state.done[p[1]+"|x"]) done++;
    });
  });
  document.getElementById("sDone").textContent = done;
  document.getElementById("sTotal").textContent = "/ " + total + " 题（核心 " + tc[0] + " + 拓展 " + tc[1] + "）";
  document.getElementById("sPct").textContent = Math.round(done/total*100) + "%";
}
function streakDays(){
  if (!state.checkins.length) return 0;
  var set = {};
  state.checkins.forEach(function(d){ set[d] = 1; });
  var n = 0, d = new Date();
  if (!set[todayStr()]) d.setDate(d.getDate()-1); // 今天还没打，从昨天起算
  while (set[d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0")]) {
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}
function renderCal(){
  var el = document.getElementById("cal"); el.innerHTML = "";
  var set = {};
  state.checkins.forEach(function(d){ set[d] = 1; });
  var today = todayStr();
  var dots = [];
  for (var i = 13; i >= 0; i--){
    var d = new Date(); d.setDate(d.getDate() - i);
    var s = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    dots.push('<span class="d' + (set[s] ? " on" : "") + (s === today ? " today" : "") + '" title="' + s + '">' + d.getDate() + '</span>');
  }
  el.innerHTML = dots.join("") + '<span id="streakLine">🔥 连续 ' + streakDays() + ' 天</span>';
  var btn = document.getElementById("btnCheckin");
  var done = !!set[today];
  btn.textContent = done ? "✅ 今日已打卡" : "📅 今日打卡";
  btn.className = done ? "done" : "";
}
function renderWrongBook(){
  var el = document.getElementById("wbList"); el.innerHTML = "";
  var keys = Object.keys(state.star).filter(function(k){ return state.star[k]; });
  if (!keys.length){
    el.innerHTML = '<span style="color:var(--tx2)">还没有错题——遇到卡住的题就点旁边的 ★。</span>';
    return;
  }
  var html = "";
  WEEKS.forEach(function(wk){
    wk.core.concat(wk.extra).forEach(function(p){
      if (state.star[p[1]] || state.star[p[1]+"|x"]) {
        html += '<div class="item" style="cursor:default"><span style="color:var(--warn)">★</span><a href="https://leetcode.cn/problems/' + p[1] + '/" target="_blank" rel="noopener">№' + p[0] + ' ' + p[2] + '</a><span class="diff ' + p[3] + '">' + p[3] + '</span><span style="font-size:11px;color:var(--tx2)">W' + wk.w + '</span></div>';
      }
    });
  });
  el.innerHTML = html || '<span style="color:var(--tx2)">还没有错题。</span>';
}
function renderAll(){ renderStats(); renderCal(); renderToc(); renderWeeks(); renderWrongBook(); }

// ---------- 事件 ----------
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.matches("input[data-key]")){
    if (t.checked) state.done[t.dataset.key] = 1; else delete state.done[t.dataset.key];
    save(); renderStats(); renderWeeks();
  }
});
document.addEventListener("click", function(e){
  var t = e.target;
  if (t.matches(".star")){
    var k = t.dataset.star;
    state.star[k] = state.star[k] ? 0 : 1;
    save(); renderWrongBook(); renderWeeks();
  }
  if (t.id === "btnCheckin"){
    var today = todayStr();
    if (state.checkins.indexOf(today) < 0) state.checkins.push(today);
    state.checkins.sort();
    save(); renderCal();
  }
  if (t.id === "btnExport"){
    var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "lc16w_plan_backup_" + todayStr() + ".json";
    a.click();
  }
  if (t.id === "btnReset"){
    if (confirm("确定清空全部打卡/勾选/错题数据？建议先导出备份。")){
      state = {done:{}, star:{}, checkins:[]};
      save(); renderAll();
    }
  }
});
document.getElementById("btnImport").addEventListener("click", function(){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json";
  inp.onchange = function(){
    var f = inp.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var d = JSON.parse(rd.result);
        if (d && d.done && d.star) { state = d; save(); renderAll(); alert("导入成功"); }
        else alert("文件格式不对");
      }catch(e){ alert("解析失败：" + e); }
    };
    rd.readAsText(f);
  };
  inp.click();
});

// ---------- 启动 ----------
load(); renderAll();
</script>
