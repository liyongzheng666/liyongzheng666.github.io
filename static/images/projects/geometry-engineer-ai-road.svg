<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">几何算法工程师的AI之路网页预览</title>
  <desc id="desc">天空与草地背景上的奶油纸张卡片，左侧是课程标题与带控制点的 Bezier 曲线，右侧是验证闭环终端面板。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#98d8ff"/>
      <stop offset="1" stop-color="#d2f0ff"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf1"/>
      <stop offset="1" stop-color="#fff3cf"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cbc4b"/>
      <stop offset="1" stop-color="#5f9a37"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
    </pattern>
    <pattern id="rows" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="18" height="36" fill="#6faa48" fill-opacity=".5"/>
    </pattern>
  </defs>

  <!-- 背景：天空 + 网格 + 云 -->
  <rect width="1200" height="750" fill="url(#sky)"/>
  <rect width="1200" height="680" fill="url(#grid)"/>
  <ellipse cx="180" cy="74" rx="64" ry="26" fill="#fff" fill-opacity=".55"/>
  <ellipse cx="246" cy="86" rx="44" ry="20" fill="#fff" fill-opacity=".45"/>
  <ellipse cx="1042" cy="64" rx="54" ry="22" fill="#fff" fill-opacity=".5"/>

  <!-- 草地 -->
  <rect x="0" y="664" width="1200" height="86" fill="url(#grass)"/>
  <rect x="0" y="664" width="1200" height="86" fill="url(#rows)" opacity=".35"/>
  <rect x="0" y="664" width="1200" height="8" fill="#4f8a2e"/>

  <!-- 左侧纸张卡片（木棕边框） -->
  <rect x="64" y="84" width="630" height="556" rx="18" fill="url(#paper)" stroke="#74552c" stroke-width="6"/>
  <rect x="78" y="98" width="602" height="528" rx="12" fill="none" stroke="#e4a24b" stroke-opacity=".4" stroke-width="2"/>

  <!-- eyebrow 徽章 -->
  <rect x="104" y="126" width="412" height="42" rx="9" fill="#ffe3a0" stroke="#bb8a3e" stroke-width="2"/>
  <text x="130" y="155" font-family="Menlo, Monaco, monospace" font-size="20" font-weight="700" fill="#5f4321">12 周 · 验证闭环 · PROMPT 工程</text>

  <!-- 标题 -->
  <text x="104" y="244" font-family="'Trebuchet MS','PingFang SC',sans-serif" font-size="62" font-weight="800" fill="#355329">几何算法工程师</text>
  <text x="104" y="324" font-family="'Trebuchet MS','PingFang SC',sans-serif" font-size="62" font-weight="800" fill="#355329">的 AI 之路</text>

  <!-- 三阶段 chips -->
  <rect x="104" y="356" width="128" height="38" rx="8" fill="#bfe3ff" stroke="#3e6fa9" stroke-width="2"/>
  <text x="126" y="383" font-family="'Trebuchet MS','PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#2c4884">表达精度</text>
  <rect x="246" y="356" width="128" height="38" rx="8" fill="#e2d8ff" stroke="#695597" stroke-width="2"/>
  <text x="268" y="383" font-family="'Trebuchet MS','PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#574788">数学引擎</text>
  <rect x="388" y="356" width="158" height="38" rx="8" fill="#cdebab" stroke="#4f7b31" stroke-width="2"/>
  <text x="410" y="383" font-family="'Trebuchet MS','PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#3d6325">调优工作流</text>

  <!-- 曲线演示区 -->
  <g>
    <polyline points="128,576 268,438 472,438 632,572" fill="none" stroke="#b39b72" stroke-width="3" stroke-dasharray="9 8"/>
    <path d="M128,576 C268,438 472,438 632,572" fill="none" stroke="#5f8fca" stroke-width="7" stroke-linecap="round"/>
    <circle cx="128" cy="576" r="11" fill="#d9534f" stroke="#7c2320" stroke-width="3"/>
    <circle cx="268" cy="438" r="11" fill="#d9534f" stroke="#7c2320" stroke-width="3"/>
    <circle cx="472" cy="438" r="11" fill="#d9534f" stroke="#7c2320" stroke-width="3"/>
    <circle cx="632" cy="572" r="11" fill="#d9534f" stroke="#7c2320" stroke-width="3"/>
    <circle cx="380" cy="472" r="8" fill="#7fb44b" stroke="#3d6325" stroke-width="3"/>
    <text x="402" y="480" font-family="Menlo, Monaco, monospace" font-size="19" fill="#6c5a42">B(t) · 双算对照</text>
  </g>

  <!-- 右侧终端面板 -->
  <g>
    <rect x="740" y="158" width="396" height="404" rx="14" fill="#0f172a" stroke="#74552c" stroke-width="6"/>
    <rect x="740" y="158" width="396" height="52" rx="14" fill="#182235"/>
    <rect x="740" y="196" width="396" height="14" fill="#182235"/>
    <circle cx="770" cy="184" r="7" fill="#fb7185"/>
    <circle cx="794" cy="184" r="7" fill="#fbbf24"/>
    <circle cx="818" cy="184" r="7" fill="#86efac"/>
    <text x="846" y="191" font-family="Menlo, Monaco, monospace" font-size="17" fill="#b8c5d6">verify-loop.sh</text>

    <text x="768" y="256" font-family="Menlo, Monaco, monospace" font-size="20" fill="#e5edf6"><tspan fill="#86efac">$</tspan> ./test_nurbs</text>
    <text x="768" y="298" font-family="Menlo, Monaco, monospace" font-size="20" fill="#e5edf6"><tspan fill="#86efac" font-weight="700">[PASS]</tspan> |P(0.25)| = 1</text>
    <text x="768" y="340" font-family="Menlo, Monaco, monospace" font-size="20" fill="#e5edf6"><tspan fill="#86efac" font-weight="700">[PASS]</tspan> |P(0.50)| = 1</text>
    <text x="768" y="382" font-family="Menlo, Monaco, monospace" font-size="20" fill="#e5edf6"><tspan fill="#86efac" font-weight="700">[PASS]</tspan> 端点插值</text>
    <text x="768" y="424" font-family="Menlo, Monaco, monospace" font-size="20" fill="#e5edf6"><tspan fill="#fbbf24" font-weight="700">[OBSV]</tspan> 权重全 1 → 非圆</text>
    <text x="768" y="478" font-family="Menlo, Monaco, monospace" font-size="20" fill="#86efac">✓ nurbs_output.svg</text>
    <line x1="768" y1="504" x2="1108" y2="504" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="768" y="536" font-family="Menlo, Monaco, monospace" font-size="17" fill="#94a3b8">验证闭环 → 可信代码</text>
  </g>

  <!-- 底部统计（草地上方的木牌风条幅） -->
  <rect x="734" y="592" width="404" height="48" rx="10" fill="#fff3cf" stroke="#74552c" stroke-width="4"/>
  <text x="754" y="624" font-family="'Trebuchet MS','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#5f4321">12 周课程 · 3 周已上线 · 8 个闭环</text>
</svg>
